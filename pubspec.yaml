name: tally
description: "Tally - Personal Finance Manager"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.6.2

  # Database
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Internationalization (date & currency format)
  intl: ^0.19.0

  # Charts (future)
  fl_chart: ^0.69.0

  # UI utilities
  cupertino_icons: ^1.0.8
  gap: ^3.0.1
  iconsax: ^0.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  custom_lint: ^0.7.6
  riverpod_lint: ^2.4.0

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/tallyAppIcon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/tallyLogoTransparan.png"
