# Memory JVM yang efisien dan seimbang (tidak membebani seluruh RAM laptop)
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC

# Eksekusi kompilasi sub-project secara paralel (memaksimalkan multi-core CPU)
org.gradle.parallel=true

# Cache hasil build antar kompilasi (task yang tidak berubah tidak dikompilasi ulang)
org.gradle.caching=true

# Mengaktifkan daemon Gradle agar build selanjutnya jauh lebih instan
org.gradle.daemon=true

# File System Watching untuk mendeteksi perubahan file tanpa scan ulang disk
org.gradle.vfs.watch=true

# AndroidX flags
android.useAndroidX=true
android.enableJetifier=false
